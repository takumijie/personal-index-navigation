name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: Check Go tests without frontend build
        run: |
          go test ./...
          go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test and build frontend
        run: |
          npm ci --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend
      - name: Verify production assets and Go checks
        run: |
          cp -R frontend/dist/. web/dist/
          go test ./...
          test -z "$(gofmt -l .)"
          go mod tidy -diff
          git diff --check
