server:
  listen: "127.0.0.1"
  port: 8081
  mode: debug
  trusted_proxies: []
  cookie_secure: false
database:
  path: data/homepage.db
storage:
  path: storage
admin:
  username: admin
  # 仅首次初始化或 --reset-admin-password 使用；已有管理员普通启动可留空。
  password: ""
upload:
  max_image_bytes: 10485760
  max_music_bytes: 52428800
media:
  # release 模式默认拒绝 HTTP 浏览器媒体；仅限受控 HTTP 部署开启。
  allow_insecure_http: false
